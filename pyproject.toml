[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-evidence-kit"
version = "0.1.1"
description = "A small offline checker for paired AI outputs and observed ChatGPT token counts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
jev-measure = "jev_measure:main"

[tool.setuptools]
py-modules = ["jev_measure"]
